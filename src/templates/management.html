<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>CMP - Panel Operativo</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="navbar">
        <img src="/static/cmp.svg" alt="CMP Logo" style="height: 45px;">
        <a href="/">← Menú Principal</a>
    </div>
    <div class="container">
        <div class="grid">
            <div class="card">
                <h2>1. Alta de Propósito Comercial</h2>
                <form id="purposeForm">
                    <div class="form-group"><label>Llave única (Key)</label><input type="text" id="pKey" placeholder="ej: email_marketing" required></div>
                    <div class="form-group"><label>Descripción Operativa</label><input type="text" id="pDesc" placeholder="ej: Envío de ofertas masivas" required></div>
                    <button type="button" onclick="submitPurpose()">Guardar Propósito</button>
                </form>
            </div>
            <div class="card">
                <h2>2. Registro de Documento Legal</h2>
                <form id="docForm">
                    <div class="form-group"><label>Nombre del Documento</label><input type="text" id="dName" placeholder="ej: Políticas de Cookies" required></div>
                    <div class="form-group"><label>Slug Identificador</label><input type="text" id="dSlug" placeholder="ej: politicas-cookies" required></div>
                    <button type="button" onclick="submitDocument()">Registrar Documento</button>
                </form>
            </div>
            <div class="card full-width">
                <h2>3. Publicar Nueva Versión de Texto Legal</h2>
                <form id="versionForm">
                    <div class="form-group">
                        <label>Seleccionar Documento Base</label>
                        <select id="vDocId">
                            {% for doc in documents %}<option value="{{ doc.id }}">{{ doc.name }} ({{ doc.slug }})</option>{% endfor %}
                        </select>
                    </div>
                    <div class="form-group"><label>Número de Versión</label><input type="number" id="vNumber" placeholder="ej: 1" min="1" required></div>
                    <div class="form-group"><label>Contenido HTML Legal</label><textarea id="vHtml" placeholder="<h3>Términos...</h3>" required></textarea></div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="vActive" checked>
                        <label for="vActive">Publicar como Versión Activa Inmediatamente</label>
                    </div>
                    <button type="button" onclick="submitVersion()" class="btn-secondary">Publicar e Inmutar Versión</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        async function submitPurpose() {
            const payload = { key: document.getElementById('pKey').value, description: document.getElementById('pDesc').value };
            const res = await fetch('/legal/purposes', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            if (res.ok) { alert("¡Propósito guardado!"); location.reload(); }
        }
        async function submitDocument() {
            const payload = { name: document.getElementById('dName').value, slug: document.getElementById('dSlug').value };
            const res = await fetch('/legal/documents', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            if (res.ok) { alert("¡Documento base registrado!"); location.reload(); }
        }
        async function submitVersion() {
            const payload = {
                document_id: parseInt(document.getElementById('vDocId').value),
                version_number: parseInt(document.getElementById('vNumber').value),
                html_content: document.getElementById('vHtml').value,
                is_active: document.getElementById('vActive').checked
            };
            const res = await fetch('/legal/versions', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            if (res.ok) { alert("¡Nueva versión publicada!"); window.location.href = "/"; }
        }
    </script>
</body>
</html>
