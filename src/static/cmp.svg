<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <!-- Gradiente para el isotipo (Verde tecnológico / Éxito) -->
    <linearGradient id="techGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#26ade4" />
    </linearGradient>
    
    <!-- Gradiente para el texto secundario -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Sombra sutil para dar volumen al isotipo -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- FONDO OSCURO TEXTURIZADO CORPORATIVO -->
  <rect width="100%" height="100%" rx="12" fill="#1e293b"/>

  <g transform="translate(10, 0)">
    <!-- ISOTIPO: EL SWITCH DE LEGALIDAD (Eslabón + Check) -->
    <g filter="url(#dropShadow)">
      <!-- Eslabón de Conexión / Nodo Base -->
      <path d="M 55,45 
               C 35,45 35,75 55,75 
               L 80,75 
               C 90,75 95,68 95,60 
               C 95,52 90,45 80,45 
               Z" 
            fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- El Switch / Check Integrado de Validación Continua -->
      <path d="M 70,60 
               L 85,75 
               L 115,40" 
            fill="none" stroke="url(#techGreen)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Punto de conexión / API activa -->
      <circle cx="55" cy="60" r="4" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    </g>

    <!-- TEXTO EN JUGADA TIPOGRÁFICA -->
    <!-- Sigla Principal -->
    <text x="140" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46" fill="#ffffff" letter-spacing="2">CMP</text>
    
    <!-- Línea divisoria estética -->
    <line x1="255" y1="42" x2="255" y2="78" stroke="#334155" stroke-width="2"/>

    <!-- Nombre del Producto / Bajada de Título -->
    <text x="275" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="url(#textGrad)" letter-spacing="1">CONSENT MANAGEMENT</text>
    <text x="275" y="76" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#2ecc71" letter-spacing="4">PLATFORM</text>
    
    <!-- Tagline de Ingeniería -->
    <text x="142" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="11" fill="#475569" letter-spacing="0.5">Filtro de Legalidad Asíncrono e Inmutable • v1.0</text>
  </g>
</svg>
